<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Comparison</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Maze : Algorithm Comparison</h1>
    <div class="container">
        <div class="input-section">
            <label for="n">Maze Size (n x n):</label>
            <input type="number" id="n" value="15" min="5" max="10000">
            <br>
            <p>Start: (0,0) | Exit: (n-1, n-1)</p>
            <br>
            <button id="generate">Generate Maze</button>
        </div>
        <div class="maze-section">
            <div id="maze"></div>
        </div>
        <div class="control-section">
            <button id="run-dfs-iterative">Run DFS Iterative</button>
            <button id="run-dfs-recursive">Run DFS Recursive</button>
        </div>
        <div class="playback-section">
            <button id="play-pause">Play</button>
            <button id="reset">Reset</button>
            <input type="range" id="progress" min="0" max="100" value="0" style="flex: 1;">
            <label for="speed">Speed:</label>
            <input type="range" id="speed" min="1" max="10" value="5">
            <span id="speed-value">5x</span>
        </div>
        <div class="results">
            <h2>Results</h2>
            <div id="dfs-iterative-result"></div>
            <div id="dfs-recursive-result"></div>
        </div>
        <div class="analysis-input">
            <button id="run-analysis">Run Analysis</button>
            <div class="view-switch">
                <input type="radio" id="view-table" name="view" value="table" checked>
                <label for="view-table">Table</label>
                <input type="radio" id="view-line" name="view" value="line">
                <label for="view-line">Line Chart</label>
                <input type="radio" id="view-bar" name="view" value="bar">
                <label for="view-bar">Bar Chart</label>
            </div>
        </div>
        <div class="analysis-section">
            <h2>Time Complexity Analysis</h2>
            <div id="analysis-content"></div>
            <div class="export-controls" id="export-controls" style="display: none;">
                <button id="export-table">Export Table to CSV</button>
                <button id="download-chart">Download Chart Image</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
